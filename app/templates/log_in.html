{% extends 'base_template.html' %}
{% block title %}
    log in
{% endblock %}

{% block content %}
<div class="banner d-flex align-items-center " style="background-image: linear-gradient(rgba(0,0,0,0.60), rgba(0,0,0,0.65)), url('{{ url_for('static', filename='images/bg.jpg') }}'); min-height:100vh">
<div class="container custom-card-position">
    <div class="row justify-content-center mb-5 ">
        <div class="col-md-6 fade-in">
            <div class="card shadow-lg rounded-lg mb-5"> <!-- Make the card slightly transparent -->
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">Log in!</h2>
                    <!-- {% with messages = get_flashed_messages(with_categories=True) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                        {% endwith %} -->

                  

                    <form action="{{ url_for('auth.log_in') }}" method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="text" class="form-control" id="email" name="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>

                        <button type="submit" class="btn btn-primary  btn-transition">Log in</button>
                    </form>

                    <p class="text-center mt-3">
                        Create an account  <a href=" {{ url_for('auth.signup_page') }}">Sign up</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>





{% endblock %}
